name: Deep Research Agent

on:
  schedule:
    # Runs every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  
permissions:
  id-token: write
  contents: read
  
jobs:
  run-research:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --pre -r requirements.txt
        
    # ----------------- OIDC FEDERATED LOGIN ADDED -----------------
    - name: Login to Azure using OIDC
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    # -------------------------------------------------------------
    
    - name: Create .env file
      run: |
        echo "PROJECT_ENDPOINT=${{ secrets.PROJECT_ENDPOINT }}" >> .env
        echo "BING_RESOURCE_NAME=${{ secrets.BING_RESOURCE_NAME }}" >> .env
        echo "DEEP_RESEARCH_MODEL_DEPLOYMENT_NAME=${{ secrets.DEEP_RESEARCH_MODEL_DEPLOYMENT_NAME }}" >> .env
        echo "MODEL_DEPLOYMENT_NAME=${{ secrets.MODEL_DEPLOYMENT_NAME }}" >> .env
        echo "EMAIL_BEARER_TOKEN=${{ secrets.EMAIL_BEARER_TOKEN }}" >> .env
        echo "EMAIL_SENDER=${{ secrets.EMAIL_SENDER }}" >> .env
        echo "EMAIL_RECIPIENT=${{ secrets.EMAIL_RECIPIENT }}" >> .env
    
    - name: Run Deep Research Agent
      run: python deepresearchagent.py
    
    - name: Upload research summary
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: research-summary
        path: research_summary.md
        retention-days: 30
